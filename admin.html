<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administracyjny</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <script>
        if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && window.innerWidth < 900)) {
            document.body.innerHTML = '<div style="color:white; text-align:center; padding:50px; font-family:sans-serif; background:#111; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;"><h1> Dostęp zablokowany</h1><p>Panel administracyjny jest dostępny tylko z poziomu komputera.</p></div>';
            throw new Error('Mobile access blocked');
        }
    </script>
    <style>
        .admin-layout { display: flex; height: 100vh; }
        .admin-sidebar { width: 400px; background: rgba(20,20,20,0.98); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; padding: 24px; color: #fff; z-index: 10; }
        .admin-preview { flex: 1; position: relative; background: #111; overflow: hidden; }
        .admin-preview #canvas-container { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 1; }
        
        .preview-mock-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            color: white;
            pointer-events: none;
            z-index: 5;
            min-width: 280px;
        }
        .preview-mock-panel h1 { margin: 0 0 8px 0; font-size: 1.8rem; letter-spacing: 2px; }
        .preview-mock-panel p { margin: 0 0 16px 0; color: #aaa; font-size: 0.9rem; }
        .preview-mock-panel .hint { font-size: 0.75rem; color: #666; margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; }

        .control-group { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .section-title { font-size: 16px; font-weight: 700; color: #0a84ff; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .control-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .control-row label { flex: 1; font-size: 13px; color: #ccc; }
        input[type="range"] { flex: 1; accent-color: #0a84ff; }
        input[type="color"] { width: 40px; height: 32px; border: none; border-radius: 6px; cursor: pointer; background: none; }
        select, input[type="text"] { width: 100%; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15); font-size: 13px; }
        .value-badge { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; font-size: 12px; min-width: 40px; text-align: center; font-family: monospace; }
        .toggle-switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #39393d; border-radius: 24px; transition: .3s; }
        .toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .3s; }
        input:checked + .toggle-slider { background-color: #34c759; }
        input:checked + .toggle-slider:before { transform: translateX(20px); }
        
        .btn-action { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; margin-top: 8px; color: white; font-size: 14px; }
        .btn-export { background: #0a84ff; }
        .btn-import { background: rgba(255,255,255,0.1); }
        .btn-return { background: #34c759; margin-top: 16px; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="section-title" style="font-size: 20px; color: #fff; margin-bottom: 24px;">️ Panel Administracyjny</div>

            <!-- SEKCJA KOMPUTER -->
            <div class="section-title">💻 Wersja Komputerowa</div>
            
            <div class="control-group">
                <div class="control-row"><label>Pozycja gogli: Lewo ↔ Prawo</label><input type="range" id="desktop_vr_x" min="0" max="100"><span class="value-badge" id="desktop_vr_x_val">50</span></div>
                <div class="control-row"><label>Pozycja gogli: Góra ↔ Dół</label><input type="range" id="desktop_vr_y" min="0" max="100"><span class="value-badge" id="desktop_vr_y_val">50</span></div>
            </div>

            <div class="control-group">
                <div class="control-row"><label>Pozycja okna: Lewo ↔ Prawo</label><input type="range" id="desktop_panel_x" min="0" max="100"><span class="value-badge" id="desktop_panel_x_val">50</span></div>
                <div class="control-row"><label>Pozycja okna: Góra ↔ Dół</label><input type="range" id="desktop_panel_y" min="0" max="100"><span class="value-badge" id="desktop_panel_y_val">50</span></div>
                <div class="control-row"><label>Rozmiar okna</label><input type="range" id="desktop_panel_size" min="0.5" max="2.0" step="0.1"><span class="value-badge" id="desktop_panel_size_val">1.0</span></div>
                <div class="control-row"><label>Przezroczystość</label><input type="range" id="desktop_panel_opacity" min="0.1" max="1.0" step="0.05"><span class="value-badge" id="desktop_panel_opacity_val">0.90</span></div>
            </div>

            <div class="control-group">
                <div class="control-row" style="flex-direction:column; align-items:flex-start; gap:4px;"><label style="font-size:12px; color:#888;">Tytuł okna</label><input type="text" id="desktop_panel_title"></div>
                <div class="control-row" style="flex-direction:column; align-items:flex-start; gap:4px; margin-top:8px;"><label style="font-size:12px; color:#888;">Opis zawartości</label><input type="text" id="desktop_panel_content_desc"></div>
                <div class="control-row" style="flex-direction:column; align-items:flex-start; gap:4px; margin-top:8px;"><label style="font-size:12px; color:#888;">Opis guzików</label><input type="text" id="desktop_panel_btn_desc"></div>
            </div>

            <div class="control-group">
                <div class="control-row"><label>Tapeta</label><select id="desktop_wallpaper_index"><option value="0">Tapeta 1</option><option value="1">Tapeta 2</option><option value="2">Tapeta 3</option><option value="3">Tapeta 4</option><option value="4">Tapeta 5</option></select></div>
                <div class="control-row"><label>Jasność tapety</label><input type="range" id="desktop_wallpaper_brightness" min="0.1" max="2.0" step="0.05"><span class="value-badge" id="desktop_wallpaper_brightness_val">1.05</span></div>
                <div class="control-row"><label>Rozmycie tapety</label><input type="range" id="desktop_wallpaper_blur" min="0" max="50"><span class="value-badge" id="desktop_wallpaper_blur_val">0</span></div>
            </div>

            <div class="control-group">
                <div class="control-row"><label>Kierunek obrotu gogli</label><select id="desktop_rotation_direction"><option value="1">Prawo</option><option value="-1">Lewo</option></select></div>
                <div class="control-row"><label>Prędkość obrotu</label><input type="range" id="desktop_rotation_speed" min="0" max="2.0" step="0.05"><span class="value-badge" id="desktop_rotation_speed_val">0.10</span></div>
            </div>

            <div class="control-group">
                <div class="control-row"><label>Kierunek wychylenia gogli</label><select id="desktop_tilt_direction"><option value="front-right">Góra → Prawo</option><option value="front-left">Góra → Lewo</option><option value="back-right">Góra → Prawo od widza</option><option value="back-left">Góra → Lewo od widza</option></select></div>
                <div class="control-row"><label>Kąt wychylenia gogli</label><input type="range" id="desktop_tilt_angle" min="0" max="90"><span class="value-badge" id="desktop_tilt_angle_val">15</span></div>
            </div>

            <!-- SEKCJA ANDROID -->
            <div class="section-title" style="margin-top: 32px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px;">📱 Wersja Android</div>

            <div class="control-group">
                <div class="control-row"><label>Pozycja gogli: Lewo ↔ Prawo</label><input type="range" id="android_vr_x" min="0" max="100"><span class="value-badge" id="android_vr_x_val">50</span></div>
                <div class="control-row"><label>Pozycja gogli: Góra ↔ Dół</label><input type="range" id="android_vr_y" min="0" max="100"><span class="value-badge" id="android_vr_y_val">20</span></div>
            </div>

            <div class="control-group">
                <div class="control-row"><label>Pozycja okna: Lewo ↔ Prawo</label><input type="range" id="android_panel_x" min="0" max="100"><span class="value-badge" id="android_panel_x_val">50</span></div>
                <div class="control-row"><label>Pozycja okna: Góra ↔ Dół</label><input type="range" id="android_panel_y" min="0" max="100"><span class="value-badge" id="android_panel_y_val">90</span></div>
                <div class="control-row"><label>Rozmiar okna</label><input type="range" id="android_panel_size" min="0.5" max="2.0" step="0.1"><span class="value-badge" id="android_panel_size_val">0.9</span></div>
                <div class="control-row"><label>Przezroczystość</label><input type="range" id="android_panel_opacity" min="0.1" max="1.0" step="0.05"><span class="value-badge" id="android_panel_opacity_val">0.90</span></div>
            </div>

            <div class="control-group">
                <div class="control-row" style="flex-direction:column; align-items:flex-start; gap:4px;"><label style="font-size:12px; color:#888;">Tytuł okna</label><input type="text" id="android_panel_title"></div>
                <div class="control-row" style="flex-direction:column; align-items:flex-start; gap:4px; margin-top:8px;"><label style="font-size:12px; color:#888;">Opis zawartości</label><input type="text" id="android_panel_content_desc"></div>
                <div class="control-row" style="flex-direction:column; align-items:flex-start; gap:4px; margin-top:8px;"><label style="font-size:12px; color:#888;">Opis guzików</label><input type="text" id="android_panel_btn_desc"></div>
            </div>

            <div class="control-group">
                <div class="control-row"><label>Tapeta</label><select id="android_wallpaper_index"><option value="0">Tapeta 1</option><option value="1">Tapeta 2</option><option value="2">Tapeta 3</option><option value="3">Tapeta 4</option><option value="4">Tapeta 5</option></select></div>
                <div class="control-row"><label>Jasność tapety</label><input type="range" id="android_wallpaper_brightness" min="0.1" max="2.0" step="0.05"><span class="value-badge" id="android_wallpaper_brightness_val">1.05</span></div>
                <div class="control-row"><label>Rozmycie tapety</label><input type="range" id="android_wallpaper_blur" min="0" max="50"><span class="value-badge" id="android_wallpaper_blur_val">0</span></div>
            </div>

            <div class="control-group">
                <div class="control-row"><label>Kierunek obrotu gogli</label><select id="android_rotation_direction"><option value="1">Prawo</option><option value="-1">Lewo</option></select></div>
                <div class="control-row"><label>Prędkość obrotu</label><input type="range" id="android_rotation_speed" min="0" max="2.0" step="0.05"><span class="value-badge" id="android_rotation_speed_val">0.10</span></div>
            </div>

            <div class="control-group">
                <div class="control-row"><label>Kierunek wychylenia gogli</label><select id="android_tilt_direction"><option value="front-right">Góra → Prawo</option><option value="front-left">Góra → Lewo</option><option value="back-right">Góra → Prawo od widza</option><option value="back-left">Góra → Lewo od widza</option></select></div>
                <div class="control-row"><label>Kąt wychylenia gogli</label><input type="range" id="android_tilt_angle" min="0" max="90"><span class="value-badge" id="android_tilt_angle_val">15</span></div>
            </div>

            <!-- GLOBALNE -->
            <div class="section-title" style="margin-top: 32px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px;">🌐 Ustawienia Globalne</div>
            <div class="control-group">
                <div class="control-row"><label>Włącz tapety</label><label class="toggle-switch"><input type="checkbox" id="wallpaperEnabled" checked><span class="toggle-slider"></span></label></div>
                <div class="control-row"><label>Kolor tła</label><input type="color" id="bgColor" value="#d6d6d6"><span class="value-badge" id="bgColorVal">#d6d6d6</span></div>
            </div>

            <button class="btn-action btn-export" id="exportBtn">📥 Eksportuj config.json</button>
            <button class="btn-action btn-import" id="importBtn">📤 Importuj config.json</button>
            <input type="file" id="importFile" accept=".json" style="display:none">
            <button class="btn-action btn-return" onclick="location.href='index.html'">⬅️ Wróć do strony</button>
        </aside>

        <main class="admin-preview">
            <div id="canvas-container"></div>
            <div id="mock-panel" class="preview-mock-panel">
                <h1>IMAGINARIUM</h1>
                <p>wirtualna przestrzeń wystawowa</p>
                <p class="hint">W A S D — ruch | mysz — rozglądanie | SHIFT — bieg</p>
            </div>
        </main>
    </div>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/vr-headset-bg.js?v=11"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
