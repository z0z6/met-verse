<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galeria — Metavers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="hud" class="hidden">
    <button id="toggle-mode" class="hud-btn">🔄 Zmień widok</button>
    <button id="exit-btn" class="hud-btn hidden" style="right:auto;left:16px;"> Wyjdź</button>
    <div id="crosshair"></div>
    <div id="joystick-base" class="hidden">
        <div id="joystick-knob"></div>
    </div>
    <div class="reticle-ring reticle-ring-left"><div class="reticle-fill"></div><div class="reticle-dot"></div></div>
    <div class="reticle-ring reticle-ring-right"><div class="reticle-fill"></div><div class="reticle-dot"></div></div>
    <div id="artwork-caption" class="hidden"></div>
</div>

<script type="module">
import { Config } from './js/config.js';
import { init as initVRHeadsetBg } from './js/vr-headset-bg.js?v=13';
import { applyPanelToElement } from './js/panelConfig.js';

async function loadConfigAndInit() {
    try {
        const response = await fetch('config.json?t=' + Date.now());
        if (response.ok) {
            const jsonConfig = await response.json();
            for (const key in jsonConfig) {
                Config.set(key, jsonConfig[key]);
            }
        }
    } catch (e) {
        console.warn('Nie udało się załadować config.json, używam ustawień domyślnych.', e);
    }
    
    document.body.style.background = Config.get('bgColor');
    
    // Inicjalizacja tła z goglami i tapetą
    const isAndroid = /Android/i.test(navigator.userAgent);
    initVRHeadsetBg('canvas-container', { 
        raiseOnMobile: true,
        forcePlatform: isAndroid ? 'android' : 'desktop'
    });
}

window.addEventListener('configchange', (e) => {
    const key = e.detail.key;
    if (key.startsWith('desktop_panel_') || key.startsWith('android_panel_')) {
        // Panel nie istnieje już w DOM, więc nic nie robimy
    }
});

window.addEventListener('resize', () => {
    // Resizing handled by main.js
});

document.addEventListener('DOMContentLoaded', loadConfigAndInit);
</script>

<!-- ZMIANA: natychmiastowe ładowanie zamiast opóźnionego requestIdleCallback -->
<script type="module" src="./src/main.js"></script>

</body>
</html>
