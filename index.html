<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria — Metavers</title>
<link rel="stylesheet" href="style.css">

<!-- Vanta.js (efekt tła "fog") + jego własna, klasyczna kopia three.js — działa
     niezależnie od modułowego three.js używanego przez resztę aplikacji poniżej,
     więc się nie gryzą (osobna globalna przestrzeń nazw vs. import modułowy). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.fog.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="intro">
  <div id="vanta-bg"></div>
  <div class="intro-panel">
    <h1>Galeria</h1>
    <p>Wirtualna przestrzeń wystawowa — chodź, zwiedzaj, dodawaj własne prace.</p>
    <div class="intro-row" id="intro-buttons">
      <button id="start-fpp" class="mode-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Pierwsza osoba</span>
      </button>
      <button id="start-tpp" class="mode-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M12 6.5v4.5m0 0l-3.2 3.5M12 11l3.2 2.2M9 18.5l-1.7 3.5M12 15l2.8 2 1 5"/></svg>
        <span>Trzecia osoba</span>
      </button>
      <button id="start-vr" class="mode-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="4.5"/><circle cx="8.2" cy="12" r="2"/><circle cx="15.8" cy="12" r="2"/><path d="M10.2 12h3.6"/></svg>
        <span>VR</span>
      </button>
    </div>
    <p class="hint">W A S D — ruch &nbsp;|&nbsp; mysz — rozglądanie (kliknij ekran, by zablokować kursor) &nbsp;|&nbsp; SHIFT — bieg</p>
  </div>
</div>

<div id="hud" class="hidden">
  <button id="toggle-mode" class="hud-btn">🔄 Zmień widok</button>
  <button id="exit-vr" class="hud-btn hidden" style="right:auto;left:16px;">✕ Wyjdź z VR</button>
  <div id="crosshair"></div>
  <div id="joystick-base" class="hidden">
    <div id="joystick-knob"></div>
  </div>
  <div id="reticle-ring"><div id="reticle-fill"></div></div>
  <div id="artwork-caption" class="hidden"></div>
  <div id="joystick-base" class="hidden"><div id="joystick-knob"></div></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
