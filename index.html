<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galeria — Metavers</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  /* Tło cząsteczek pod spodem */
  #canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }
  /* Panel startowy nad tłem cząsteczek */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
</style>
</head>
<body>

<!-- Kontener dla systemu cząsteczek -->
<div id="canvas-container"></div>

<div id="intro">
  <div class="intro-panel">
    <h1>Galeria</h1>
    <p>Wirtualna przestrzeń wystawowa — chodź, zwiedzaj, dodawaj własne prace.</p>

    <div class="intro-row" id="intro-buttons">
      <button id="start-fpp" class="mode-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Pierwsza osoba</span>
      </button>
      <button id="start-tpp" class="mode-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M12 6.5v4.5m0 0l-3.2 3.5M12 11l3.2 2.2M9 18.5l-1.7 3.5M12 15l2.8 2 1 5"/></svg>
        <span>Trzecia osoba</span>
      </button>
      <button id="start-vr" class="mode-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="4.5"/><circle cx="8.2" cy="12" r="2"/><circle cx="15.8" cy="12" r="2"/><path d="M10.2 12h3.6"/></svg>
        <span>VR</span>
      </button>
    </div>

    <p class="hint">W A S D — ruch &nbsp;|&nbsp; mysz — rozglądanie (kliknij ekran, by zablokować kursor) &nbsp;|&nbsp; SHIFT — bieg</p>

    <!-- Szybki zapis koloru tła -->
    <div class="bg-quick-panel">
      <div class="bg-quick-label">
        <span>Tło</span>
        <a href="admin.html" style="color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;">⚙️ Pełny panel admina</a>
      </div>
      <div class="bg-quick-row">
        <input type="color" id="bg-quick-color" value="#050510">
        <button id="bg-quick-save" class="bg-save-btn">Zapisz ustawienia</button>
      </div>
      <div id="bg-save-status"></div>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <button id="toggle-mode" class="hud-btn">🔄 Zmień widok</button>
  <button id="exit-vr" class="hud-btn hidden" style="right:auto;left:16px;">✕ Wyjdź z VR</button>
  <div id="crosshair"></div>
  <div id="joystick-base" class="hidden">
    <div id="joystick-knob"></div>
  </div>
  <div id="reticle-ring"><div id="reticle-fill"></div></div>
  <div id="artwork-caption" class="hidden"></div>
</div>

<!-- Skrypt inicjalizujący system cząsteczek z pliku JSON + panel szybkiego zapisu tła -->
<script type="module">
  import { Config } from './js/config.js';
  import { init } from './js/particles.js';

  async function loadConfigAndInit() {
    try {
      const response = await fetch('config.json');
      if (response.ok) {
        const jsonConfig = await response.json();
        // Nadpisujemy domyślne wartości tylko wtedy, gdy w localStorage
        // nie ma jeszcze zapisanych ustawień użytkownika (Config.get sam
        // odczytuje localStorage, więc nie chcemy nadpisywać go co odświeżenie).
        for (const key in jsonConfig) {
          if (localStorage.getItem('metaverse_' + key) === null) {
            Config.set(key, jsonConfig[key]);
          }
        }
      }
    } catch (e) {
      console.warn('Nie udało się załadować config.json, używam ustawień domyślnych.', e);
    }

    document.body.style.background = Config.get('bgColor');
    init('canvas-container');

    // --- Panel szybkiego zapisu koloru tła ---
    const colorInput = document.getElementById('bg-quick-color');
    const saveBtn = document.getElementById('bg-quick-save');
    const status = document.getElementById('bg-save-status');

    colorInput.value = Config.get('bgColor');

    // Podgląd na żywo podczas wyboru koloru
    colorInput.addEventListener('input', (e) => {
      Config.set('bgColor', e.target.value);
    });

    // Jawny zapis (Config.set i tak zapisuje do localStorage od razu,
    // ale przycisk daje użytkownikowi potwierdzenie akcji)
    saveBtn.addEventListener('click', () => {
      Config.set('bgColor', colorInput.value);
      status.textContent = 'Zapisano ustawienia tła ✓';
      setTimeout(() => { status.textContent = ''; }, 2000);
    });
  }

  document.addEventListener('DOMContentLoaded', loadConfigAndInit);
</script>

<!-- Główna logika metaversum -->
<script type="module" src="src/main.js"></script>
</body>
</html>
