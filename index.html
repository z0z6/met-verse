<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria — Metavers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        /* Panel startowy - pozycjonowanie zarządzane przez JS */
        .intro-panel {
            position: fixed !important;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 48px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            pointer-events: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .intro-panel h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .intro-panel > p {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 24px;
            font-weight: 300;
        }
        .intro-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .mode-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 16px 24px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
            justify-content: center;
        }
        .mode-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .mode-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .mode-btn.long-label {
            min-width: 200px;
            font-size: 0.85rem;
        }
        .mode-btn .icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }
        .hint {
            font-size: 0.85rem;
            color: #666;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 1.6;
        }
        /* Ukryj domyślne centrowanie #intro */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="intro">
    <div class="intro-panel">
        <h1>IMAGINARIUM</h1>
        <p>wirtualna przestrzeń wystawowa</p>
        <div class="intro-row" id="intro-buttons">
            <button id="start-fpp" class="mode-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>Pierwsza osoba</span>
            </button>
            <button id="start-tpp" class="mode-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M12 6.5v4.5m0 0l-3.2 3.5M12 11l3.2 2.2M9 18.5l-1.7 3.5M12 15l2.8 2 1 5"/></svg>
                <span>Trzecia osoba</span>
            </button>
            <button id="start-vr" class="mode-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="4.5"/><circle cx="8.2" cy="12" r="2"/><circle cx="15.8" cy="12" r="2"/><path d="M10.2 12h3.6"/></svg>
                <span>VR</span>
            </button>
        </div>
        <p class="hint">W A S D — ruch | mysz — rozglądanie (kliknij ekran, by zablokować kursor) | SHIFT — bieg</p>
    </div>
</div>

<div id="hud" class="hidden">
    <button id="toggle-mode" class="hud-btn">🔄 Zmień widok</button>
    <button id="exit-btn" class="hud-btn hidden" style="right:auto;left:16px;">✕ Wyjdź</button>
    <div id="crosshair"></div>
    <div id="joystick-base" class="hidden">
        <div id="joystick-knob"></div>
    </div>
    <div class="reticle-ring reticle-ring-left"><div class="reticle-fill"></div><div class="reticle-dot"></div></div>
    <div class="reticle-ring reticle-ring-right"><div class="reticle-fill"></div><div class="reticle-dot"></div></div>
    <div id="artwork-caption" class="hidden"></div>
</div>

<script type="module">
import { Config } from './js/config.js';
import { init as initVRHeadsetBg } from './js/vr-headset-bg.js?v=12';
import { applyPanelToElement } from './js/panelConfig.js';

function positionIntroPanel() {
    const platform = /Android/i.test(navigator.userAgent) ? 'android' : 'desktop';
    const panel = document.querySelector('.intro-panel');
    if (panel) {
        applyPanelToElement(panel, platform + '_', null);
    }
}

async function loadConfigAndInit() {
    try {
        const response = await fetch('config.json');
        if (response.ok) {
            const jsonConfig = await response.json();
            for (const key in jsonConfig) {
                if (localStorage.getItem('metaverse_' + key) === null) {
                    Config.set(key, jsonConfig[key]);
                }
            }
        }
    } catch (e) {
        console.warn('Nie udało się załadować config.json, używam ustawień domyślnych.', e);
    }
    
    document.body.style.background = Config.get('bgColor');
    initVRHeadsetBg('canvas-container', { raiseOnMobile: true });
    
    // Pozycjonowanie panelu - czekamy aż DOM będzie gotowy i panel ma wymiary
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            positionIntroPanel();
        });
    });
}

// Nasłuchuj zmian configu (np. po imporcie JSON)
window.addEventListener('configchange', (e) => {
    const key = e.detail.key;
    if (key.startsWith('desktop_panel_') || key.startsWith('android_panel_')) {
        positionIntroPanel();
    }
});

// Pozycjonuj panel przy zmianie rozmiaru okna
window.addEventListener('resize', () => {
    positionIntroPanel();
});

document.addEventListener('DOMContentLoaded', loadConfigAndInit);
</script>

<script>
function loadGallery() { import('./src/main.js'); }
if ('requestIdleCallback' in window) {
    requestIdleCallback(loadGallery, { timeout: 1200 });
} else {
    window.addEventListener('load', loadGallery);
}
</script>

</body>
</html>
