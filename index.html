<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MET-VERSE VR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #webgl-container {
      width: 100%;
      height: 100dvh;
      display: block;
    }

    /* Panel Admina */
    #admin-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: calc(100% - 24px);
      max-width: 320px;
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      background: rgba(15, 15, 20, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      color: #ffffff;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      z-index: 100;
    }

    #admin-panel.collapsed .panel-content {
      display: none;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .panel-header h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #00ffcc;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .panel-content {
      margin-top: 14px;
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: #cccccc;
    }

    .control-group input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100%;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }

    .control-group input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .control-group input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: #00ffcc;
      cursor: pointer;
    }

    .btn-save {
      width: 100%;
      padding: 10px;
      background: #00ffcc;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 12px;
      margin-top: 8px;
      transition: background 0.2s ease;
    }

    .btn-save:hover {
      background: #00cca3;
    }

    #save-status {
      font-size: 11px;
      text-align: center;
      margin-top: 6px;
      color: #00ffcc;
      min-height: 15px;
    }
  </style>
  <!-- Three.js z bezpiecznego CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Podpięcie app.js w folderze js/ -->
  <script src="js/app.js" defer></script>
</head>
<body>

  <div id="webgl-container"></div>

  <!-- Panel Admina -->
  <div id="admin-panel">
    <div class="panel-header" id="panel-toggle">
      <h2>Konfiguracja VR</h2>
      <button class="toggle-btn" id="toggle-icon">▼</button>
    </div>
    
    <div class="panel-content">
      <div class="control-group">
        <label for="bgColor">Kolor tła</label>
        <input type="color" id="bgColor" value="#050508" />
      </div>

      <div class="control-group">
        <label for="vrColor">Kolor gogli VR</label>
        <input type="color" id="vrColor" value="#00ffcc" />
      </div>

      <div class="control-group">
        <label for="gridColor">Kolor siatki tła</label>
        <input type="color" id="gridColor" value="#1a2636" />
      </div>

      <div class="control-group">
        <label for="zoom">Przybliżenie (Zoom) <span id="val-zoom">1.00</span></label>
        <input type="range" id="zoom" min="0.4" max="2.5" step="0.05" value="1.0" />
      </div>

      <div class="control-group">
        <label for="speed">Prędkość obrotu <span id="val-speed">0.010</span></label>
        <input type="range" id="speed" min="0.000" max="0.050" step="0.002" value="0.010" />
      </div>

      <div class="control-group">
        <label for="tilt">Kąt wychylenia (Tilt) <span id="val-tilt">15°</span></label>
        <input type="range" id="tilt" min="-45" max="45" step="1" value="15" />
      </div>

      <button id="save-btn" class="btn-save">Zapisz ustawienia</button>
      <div id="save-status"></div>
    </div>
  </div>

</body>
</html>
