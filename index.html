<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria — Metavers</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  /* Tło pod spodem (gogle VR / cząsteczki) */
  #canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }
  /* Panel startowy nad tłem */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
</style>
</head>
<body>

<!-- Kontener na tło 3D -->
<div id="canvas-container"></div>

<div id="intro">
  <div class="intro-panel">
    <h1>Galeria</h1>
    <p>Wirtualna przestrzeń wystawowa — chodź, zwiedzaj, dodawaj własne prace.</p>
    <div class="intro-row" id="intro-buttons">
      <button id="start-fpp" class="mode-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Pierwsza osoba</span>
      </button>
      <button id="start-tpp" class="mode-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M12 6.5v4.5m0 0l-3.2 3.5M12 11l3.2 2.2M9 18.5l-1.7 3.5M12 15l2.8 2 1 5"/></svg>
        <span>Trzecia osoba</span>
      </button>
      <button id="start-vr" class="mode-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="4.5"/><circle cx="8.2" cy="12" r="2"/><circle cx="15.8" cy="12" r="2"/><path d="M10.2 12h3.6"/></svg>
        <span>VR</span>
      </button>
    </div>
    <p class="hint">W A S D — ruch &nbsp;|&nbsp; mysz — rozglądanie (kliknij ekran, by zablokować kursor) &nbsp;|&nbsp; SHIFT — bieg</p>
    <p class="hint" style="margin-top: 15px; font-size: 0.85em; opacity: 0.6;">
      <a href="admin.html" style="color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor;">⚙️ Dostosuj tło (Panel Admina)</a>
    </p>
  </div>
</div>

<div id="hud" class="hidden">
  <button id="toggle-mode" class="hud-btn">🔄 Zmień widok</button>
  <button id="exit-vr" class="hud-btn hidden" style="right:auto;left:16px;">✕ Wyjdź z VR</button>
  <div id="crosshair"></div>
  <div id="joystick-base" class="hidden">
    <div id="joystick-knob"></div>
  </div>
  <div id="reticle-ring"><div id="reticle-fill"></div></div>
  <div id="artwork-caption" class="hidden"></div>
</div>

<!-- Inicjalizacja tła: gogle VR (wireframe, obracające się) -->
<script type="module">
import { Config } from './js/config.js';
import { init as initVRHeadsetBg } from './js/vr-headset-bg.js';

async function loadConfigAndInit() {
  try {
    const response = await fetch('config.json');
    if (response.ok) {
      const jsonConfig = await response.json();
      for (const key in jsonConfig) {
        Config.set(key, jsonConfig[key]);
      }
    }
  } catch (e) {
    console.warn('Nie udało się załadować config.json, używam ustawień domyślnych.', e);
  }
  document.body.style.background = Config.get('bgColor');
  initVRHeadsetBg('canvas-container');
}

document.addEventListener('DOMContentLoaded', loadConfigAndInit);
</script>

<!-- Główna logika metaversum -->
<script type="module" src="src/main.js"></script>

</body>
</html>
