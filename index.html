<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- CRITICAL: natychmiastowe tło i tapeta — blokujemy biały ekran FOUC -->
    <script>
    (function() {
        var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
            || (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
        var wpPath = isMobile ? './wallpapers/wallpaper1.webp' : './wallpapers/wallpaper3.webp';
        var el = document.createElement('style');
        el.textContent = 
            'body{background:#d6d6d6;margin:0;overflow:hidden}' +
            '#canvas-container{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0}' +
            '#wallpaper-layer{position:absolute;top:0;left:0;width:100%;height:100%;background:url(' + wpPath + ') center/cover no-repeat;z-index:0}';
        document.head.appendChild(el);
    })();
    </script>
    
    <title>Galeria — Metavers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <style>
        body { background: #d6d6d6; margin: 0; overflow: hidden; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        
        .intro-panel {
            position: fixed;
            /* Wartości top/left/transform/opacity/filter poniżej to statyczny
               odpowiednik tego, co i tak zaraz policzy i ustawi JS
               (positionIntroPanel() -> applyPanelToElement()) na podstawie
               config.json. Dzięki temu PIERWSZA klatka strony (zanim
               jakikolwiek JS zdąży się wykonać) wygląda już tak, jak
               docelowo — bez efektu "dużego, wyśrodkowanego" panelu, który
               po chwili się przestawia. Jeśli zmienisz desktop_panel_* w
               config.json, zaktualizuj też te wartości, żeby nie wróciło
               widoczne "mrugnięcie". */
            top: 85%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            transform-origin: center center;
            opacity: 0.75;
            filter: brightness(1.7);
            -webkit-filter: brightness(1.7);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 48px;
            text-align: center;
            width: fit-content;
            max-width: 600px;
            pointer-events: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 10;
            box-sizing: border-box;
        }
        .intro-panel h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 12px;
            color: #E0AE91;
        }
        .intro-panel > p { font-size: 1.1rem; color: #aaa; margin-bottom: 24px; font-weight: 300; }
        
        /* DESKTOP: dwa przyciski obok siebie, wyrównane do szerokości tytułu */
        .intro-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: nowrap;
            margin-bottom: 24px;
            width: 100%;
        }
        
        .mode-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 14px 18px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
            height: 75px;
            flex-shrink: 0;
        }
        
        .mode-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .mode-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .mode-btn .icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }
        
        .mode-btn span {
            font-size: 0.75rem;
            line-height: 1.2;
            text-align: center;
        }
        
        /* Ukryj przycisk VR na desktopie */
        .vr-mobile-only {
            display: none;
        }
        
        .hint {
            font-size: 0.85rem;
            color: #666;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            line-height: 1.6;
        }
        #intro { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }

        /* MOBILE: pełne teksty, większe przyciski, w tym VR */
        @media (max-width: 768px) and (pointer: coarse) {
            .intro-panel {
                /* Statyczny odpowiednik android_panel_* z config.json —
                   ten sam powód co w regule .intro-panel wyżej. */
                top: 93%;
                transform: translate(-50%, -50%) scale(0.7);
                opacity: 0.9;
                filter: brightness(1.3);
                -webkit-filter: brightness(1.3);
                width: 90vw; 
                max-width: 95vw; 
                padding: 32px 24px; 
            }
            .intro-panel h1 { font-size: 2rem; letter-spacing: 2px; }
            .intro-panel > p { font-size: 0.95rem; margin-bottom: 20px; }
            .intro-row { flex-direction: column; gap: 12px; }
            .mode-btn {
                flex-direction: row;
                justify-content: center;
                height: auto;
                padding: 14px 20px;
            }
            .mode-btn .icon { width: 24px; height: 24px; }
            .mode-btn span { font-size: 0.9rem; }
            .hint { font-size: 0.75rem; margin-top: 16px; padding-top: 12px; }
            
            /* Pokaż przycisk VR tylko na mobile */
            .vr-mobile-only {
                display: flex;
            }
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <div id="wallpaper-layer"></div>
</div>

<div id="intro">
    <div class="intro-panel">
        <h1>IMAGINARIUM</h1>
        <p>wirtualna przestrzeń wystawowa</p>
        <div class="intro-row" id="intro-buttons">
            <button id="start-fpp" class="mode-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>Pierwsza</span>
            </button>
            <button id="start-tpp" class="mode-btn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M12 6.5v4.5m0 0l-3.2 3.5M12 11l3.2 2.2M9 18.5l-1.7 3.5M12 15l2.8 2 1 5"/></svg>
                <span>Trzecia</span>
            </button>
            <button id="start-vr" class="mode-btn vr-mobile-only">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="4.5"/><circle cx="8.2" cy="12" r="2"/><circle cx="15.8" cy="12" r="2"/><path d="M10.2 12h3.6"/></svg>
                <span>VR</span>
            </button>
        </div>
        <p class="hint">W A S D — ruch | mysz — rozglądanie (kliknij ekran, by zablokować kursor) | SHIFT — bieg</p>
    </div>
</div>

<div id="hud" class="hidden">
    <button id="toggle-mode" class="hud-btn">🔄 Zmień widok</button>
    <button id="exit-btn" class="hud-btn hidden" style="right:auto;left:16px;">✕ Wyjdź</button>
    <div id="crosshair"></div>
    <div id="joystick-base" class="hidden">
        <div id="joystick-knob"></div>
    </div>
    <div class="reticle-ring reticle-ring-left"><div class="reticle-fill"></div><div class="reticle-dot"></div></div>
    <div class="reticle-ring reticle-ring-right"><div class="reticle-fill"></div><div class="reticle-dot"></div></div>
    <div id="artwork-caption" class="hidden"></div>
</div>

<script type="module">
import { Config } from './js/config.js';
import { init as initVRHeadsetBg } from './js/vr-headset-bg.js?v=14';
import { applyPanelToElement } from './js/panelConfig.js';

function isMobilePlatform() {
    return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && window.innerWidth < 900);
}

function positionIntroPanel() {
    const platform = isMobilePlatform() ? 'android' : 'desktop';
    const panel = document.querySelector('.intro-panel');
    if (panel) {
        applyPanelToElement(panel, platform + '_', null);
    }
}

async function loadConfigAndInit() {
    // Ustawiamy panel OD RAZU na podstawie wbudowanych wartości domyślnych
    // (js/config.js), które są identyczne z config.json. Nie czekamy na
    // fetch() — to on odpowiadał za widoczny "skok" z dużego, wyśrodkowanego
    // panelu do właściwego wyglądu: zanim odpowiedź z sieci wracała, strona
    // przez chwilę stała przy ustawieniach startowych.
    positionIntroPanel();

    try {
        const response = await fetch('config.json?t=' + Date.now());
        if (response.ok) {
            const jsonConfig = await response.json();
            for (const key in jsonConfig) {
                Config.set(key, jsonConfig[key]);
            }
        }
    } catch (e) {
        console.warn('Nie udało się załadować config.json, używam ustawień domyślnych.', e);
    }

    document.body.style.background = Config.get('bgColor');

    initVRHeadsetBg('canvas-container', {
        raiseOnMobile: true,
        forcePlatform: isMobilePlatform() ? 'android' : 'desktop'
    });

    // Ponowne dopasowanie już PO wczytaniu config.json — istotne tylko wtedy,
    // gdy ktoś zmieni wartości w config.json bez aktualizacji DEFAULTS w
    // js/config.js (np. przez panel administracyjny). Przy zgodnych
    // wartościach to wywołanie nic wizualnie nie zmienia.
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            positionIntroPanel();
        });
    });
}

window.addEventListener('configchange', (e) => {
    const key = e.detail.key;
    if (key.startsWith('desktop_panel_') || key.startsWith('android_panel_')) {
        positionIntroPanel();
    }
});

window.addEventListener('resize', () => {
    positionIntroPanel();
});

document.addEventListener('DOMContentLoaded', loadConfigAndInit);
</script>

<script>
function loadGallery() { 
    import('./src/main.js'); 
}
if ('requestIdleCallback' in window) {
    requestIdleCallback(loadGallery, { timeout: 1200 });
} else {
    window.addEventListener('load', loadGallery);
}
</script>

</body>
</html>
