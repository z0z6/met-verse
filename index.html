<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria — Metavers</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="intro">
  <div class="intro-panel">
    <h1>🖼️ Galeria</h1>
    <p>Wirtualna przestrzeń wystawowa — chodź, zwiedzaj, dodawaj własne prace.</p>
    <div class="intro-row" id="intro-buttons">
      <button id="start-fpp" class="mode-btn">👁️ Pierwsza osoba</button>
      <button id="start-tpp" class="mode-btn">🚶 Trzecia osoba</button>
    </div>
    <p class="hint">W A S D — ruch &nbsp;|&nbsp; mysz — rozglądanie (kliknij ekran, by zablokować kursor) &nbsp;|&nbsp; SHIFT — bieg</p>
  </div>
</div>

<div id="hud" class="hidden">
  <button id="toggle-mode" class="hud-btn">🔄 Zmień widok</button>
  <div id="crosshair"></div>
  <div id="reticle-ring"><div id="reticle-fill"></div></div>
  <div id="artwork-caption" class="hidden"></div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
